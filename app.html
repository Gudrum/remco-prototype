i"><b>Extender</b><div class="muted" style="margin-top:6px">Solicita más días</div></div><div class="mini"><b>Asistencia</b><div class="muted" style="margin-top:6px">Contacta a REMCO</div></div></div></div><div class="nav"><div class="active">Inicio</div><div>Reservas</div><div>Documentos</div><div>Perfil</div></div></div></div></body></html>
